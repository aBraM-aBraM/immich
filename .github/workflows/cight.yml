# cight on this fork (a test of aBraM-aBraM/cight): Immich's e2e suites run under `cight run`.
# On main every test runs and the map goes to the cloud (the two suites are its two shards); on a
# pull request every test still runs (shadow) and the job summary says what cight would have run.
name: cight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the job's OIDC token is how the cloud knows this repository

env:
  CIGHT_URL: https://xjppyrz23icxj77lrhrqhumqbm0buobs.lambda-url.eu-north-1.on.aws

jobs:
  e2e:
    name: e2e ${{ matrix.suite }} under cight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: api
            shard: 1/2
            tests: pnpm test
          - suite: web
            shard: 2/2
            tests: pnpm test:web
    defaults:
      run:
        working-directory: ./e2e
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # the merge base with main, for the diff
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install cight
        working-directory: .
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cight" | jq -r .value)
          mkdir -p "$HOME/.cight/bin"
          curl -fsSL -H "Authorization: Bearer $token" "$CIGHT_URL/v1/client" -o "$HOME/.cight/bin/cight"
          chmod +x "$HOME/.cight/bin/cight"
          echo "$HOME/.cight/bin" >> "$GITHUB_PATH"

      - name: Setup (api)
        if: matrix.suite == 'api'
        run: |
          pnpm --filter @immich/sdk --filter @immich/cli install --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/cli build
          (cd ../web && pnpm install --frozen-lockfile && pnpm exec svelte-kit sync)
          pnpm install --frozen-lockfile

      - name: Setup (web)
        if: matrix.suite == 'web'
        run: |
          pnpm --filter @immich/sdk install --frozen-lockfile
          pnpm --filter @immich/sdk build
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --only-shell

      - name: e2e under cight
        env:
          CIGHT_SHARD: ${{ matrix.shard }}
          VITEST_DISABLE_DOCKER_SETUP: true
          PLAYWRIGHT_DISABLE_WEBSERVER: true
          TESTS: ${{ matrix.tests }}
        run: |
          mode=map
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then mode=shadow; fi
          # the stack starts inside `cight run`, so its containers get the agent
          cight run --mode "$mode" --repo .. -- bash -c \
            "docker compose up -d --build --renew-anon-volumes --force-recreate --remove-orphans --wait --wait-timeout 300 && $TESTS"

      - name: Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose-logs.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cight-${{ matrix.suite }}
          path: |
            e2e/docker-compose-logs.txt
            .cight/run/*/cight-report.md
          if-no-files-found: ignore
