# cight: keep this fork replaying upstream (main merged in, open PRs mirrored as PRs here), so
# the e2e runs' shadow record covers upstream's real pull requests. See .github/cight/README.md.
name: cight mirror
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      what:
        description: 'sync (main only), prs (mirror PRs only) or all'
        type: choice
        options: [all, sync, prs]
        default: all
concurrency:
  group: cight-mirror
  cancel-in-progress: false
permissions: {}
jobs:
  mirror:
    # the App's key is in the cight-mirror environment, which only main may use: mirror
    # branches run upstream contributors' code and must never reach it
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cight-mirror
    timeout-minutes: 30
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CIGHT_MIRROR_CLIENT_ID }}
          private-key: ${{ secrets.CIGHT_MIRROR_APP_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true # mirror.py pushes main and mirror/* as the App

      - name: Commit as the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - name: Mirror
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WHAT: ${{ inputs.what || 'all' }}
        run: python3 .github/cight/mirror.py "$WHAT"
